services:
  - type: web
    name: tds-config-precedence-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: development
      - key: APP_PORT
        value: "8122"
      - key: APP_WORKERS
        value: "13"
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOG_LEVEL
        value: debug
      - key: APP_API_KEY
        value: key-nj6x3r76dg
